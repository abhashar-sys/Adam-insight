[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adam-insight-customer-context-agent"
version = "0.1.0"
description = "HTTP facade for node services and LangGraph execution providing Customer Intelligence Cards."
readme = "README.md"
authors = [
    { name = "Neha Bhaskar" }
]
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Framework :: FastAPI",
]

# Core runtime dependencies (What your app needs to run in production)
dependencies = [
    "fastapi==0.116.1",
    "httpx==0.28.1",
    "langgraph",
    "pydantic==2.13.4",
    "python-dotenv==1.2.1",
    "uvicorn==0.35.0",
    "pyyaml",
]

# Development & Testing dependencies
[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]