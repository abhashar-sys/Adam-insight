[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-intel-agent"
version = "0.1.0"
description = "DDoS traffic analysis agent using LangGraph, ClickHouse, and Cassandra."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }

dependencies = [
    "clickhouse-driver>=0.2.9",
    "cassandra-driver>=3.29",
    "pydantic>=2.0",
    "scipy>=1.11",
    "numpy>=1.26",
    "langgraph>=0.2",
    "python-dotenv>=1.0",
    "matplotlib>=3.8",
    # API server
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.scripts]
# Exposes `traffic-intel-agent` as a CLI entrypoint after pip install.
# Expects traffic_intel_agent/main.py to expose a `main()` function.
traffic-intel-agent = "traffic_intel_agent.main:main"
# Exposes `traffic-intel-api` to start the FastAPI/Uvicorn server.
traffic-intel-api = "traffic_intel_agent.api:run"

[tool.setuptools.packages.find]
# Tells setuptools to look for packages under src/ only.
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
