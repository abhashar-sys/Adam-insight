# =============================================================================
# values.yaml — Default configuration for adam-insight-traffic-intel-agent
# Override per-environment with: helm upgrade ... -f values-prod.yaml
# =============================================================================

# ---------------------------------------------------------------------------
# Image
# ---------------------------------------------------------------------------
image:
  repository: registry.spock.tn.akamai.com/plx/adam-insight/adam-insight-traffic-intel-agent
  tag: "0.1.0"           # Pinned tag; use "latest" only in dev
  pullPolicy: IfNotPresent

imagePullSecrets: []
# - name: regcred

# ---------------------------------------------------------------------------
# Replica count & update strategy
# ---------------------------------------------------------------------------
replicaCount: 2   # minimum for HA; PDB ensures 1 pod stays up during rolling updates

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# ---------------------------------------------------------------------------
# Service
# ---------------------------------------------------------------------------
service:
  type: ClusterIP        # Use LoadBalancer or NodePort to expose externally
  port: 80               # Port exposed by the Service
  targetPort: 8080       # Port the container listens on (must match Dockerfile EXPOSE)

# ---------------------------------------------------------------------------
# Resources — set requests/limits to avoid OOM kills and noisy neighbours
# ---------------------------------------------------------------------------
resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "1Gi"

# ---------------------------------------------------------------------------
# Probes — hit the FastAPI /health endpoint for accurate liveness/readiness.
# ---------------------------------------------------------------------------
livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 20
  periodSeconds: 30
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 10
  failureThreshold: 3

# ---------------------------------------------------------------------------
# Environment variables
# Non-sensitive values are set directly; sensitive values reference Secrets.
# ---------------------------------------------------------------------------
env:
  # Application behaviour
  LOG_LEVEL: "INFO"
  PYTHONUNBUFFERED: "1"

  # ClickHouse connection (non-sensitive; credentials come from Secret below)
  CLICKHOUSE_HOST: "datalake.spock-dart-nss1-8.plx.tn.akamai.com"
  CLICKHOUSE_PORT: "9440"
  CLICKHOUSE_SECURE: "true"
  CLICKHOUSE_DATABASE: "owl_bronze"
  # CLICKHOUSE_USERNAME and CLICKHOUSE_PASSWORD injected via envFromSecret

  # Cassandra connection (non-sensitive; credentials come from Secret below)
  CASSANDRA_CONTACT_POINTS: "198.18.238.66:9042,198.18.238.67:9042,198.18.238.68:9042,198.18.238.69:9042,198.18.238.70:9042,198.18.238.71:9042,198.18.238.72:9042,198.18.238.73:9042"
  CASSANDRA_PORT: "9042"
  CASSANDRA_DATACENTER: "DEV01"
  CASSANDRA_KEYSPACE: "touchstone_ks"
  # CASSANDRA_USER and CASSANDRA_PASSWORD injected via envFromSecret

# Reference to an existing Kubernetes Secret that holds sensitive credentials.
# Create it with:
#   kubectl create secret generic traffic-intel-agent-credentials \
#     --from-literal=CLICKHOUSE_USER=... \
#     --from-literal=CLICKHOUSE_PASSWORD=... \
#     --from-literal=CASSANDRA_USER=... \
#     --from-literal=CASSANDRA_PASSWORD=...
envFromSecret:
  enabled: true
  secretName: "traffic-intel-agent-credentials"

# ---------------------------------------------------------------------------
# ConfigMap — non-sensitive config files mounted into the container
# ---------------------------------------------------------------------------
configMap:
  enabled: true
  data: {}  # Add key/value pairs here; they are mounted as env vars

# ---------------------------------------------------------------------------
# Service account
# ---------------------------------------------------------------------------
serviceAccount:
  create: true
  name: ""
  annotations: {}

# ---------------------------------------------------------------------------
# Pod-level settings
# ---------------------------------------------------------------------------
podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false   # Set to true once you confirm no runtime writes
  capabilities:
    drop: ["ALL"]

# ---------------------------------------------------------------------------
# Node scheduling
# ---------------------------------------------------------------------------
nodeSelector: {}
tolerations: []
affinity: {}

# ---------------------------------------------------------------------------
# Autoscaling (disabled by default; enable once load profile is understood)
# ---------------------------------------------------------------------------
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

# Registry pull secret — created via kubectl create secret docker-registry
imagePullSecrets:
  - name: spock-registry-creds
